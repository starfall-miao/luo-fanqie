name: Android Beta Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Beta 标签，必须以 -beta. 结尾，例如 v1.1.0-beta.1'
        required: true
        default: 'v1.1.0-beta.1'
      build_number:
        description: 'Android versionCode（需大于已安装版本）'
        required: true
        default: '101'
  push:
    tags:
      - 'v*-beta.*'

permissions:
  contents: write

concurrency:
  group: android-beta
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK & publish beta release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/luo-fanqie-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=luo-fanqie-release.jks\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
            echo "Release signing configured."
          else
            echo "::warning::No signing secrets configured; falling back to debug signing."
          fi

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            BUILD_NUMBER="${{ inputs.build_number }}"
          else
            TAG="${GITHUB_REF_NAME}"
            BUILD_NUMBER="$((GITHUB_RUN_NUMBER + 100))"
          fi
          if [[ "$TAG" != *"-beta."* ]]; then
            echo "::error::Release tags must contain -beta. (got: $TAG)"
            exit 1
          fi
          BUILD_NAME="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build signed APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.meta.outputs.build_name }}" \
            --build-number="${{ steps.meta.outputs.build_number }}"

      - name: Build web bundle
        run: flutter build web --release --build-name="${{ steps.meta.outputs.build_name }}" --build-number="${{ steps.meta.outputs.build_number }}"

      - name: Package release assets
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/luo-fanqie-${TAG}-universal.apk"
          (cd build/web && zip -qr "../../dist/luo-fanqie-${TAG}-web.zip" .)
          (cd dist && sha256sum "luo-fanqie-${TAG}-universal.apk" > "luo-fanqie-${TAG}-universal.apk.sha256")
          cat > release-notes.md <<NOTES
          ## 落·番茄 ${{ steps.meta.outputs.build_name }} · Beta

          这是由 GitHub Actions 自动构建的 beta 测试包，功能与界面仍在持续迭代中。

          - Android 通用 APK：支持 arm64-v8a / armeabi-v7a / x86_64
          - 最低 Android 7.0（API 24），targetSdk 36
          - Web 构建产物同时附在 Release 中
          - 安装前请确认通知权限与精确闹钟权限；系统通知在 Android 上生效

          校验 SHA-256 文件已一并上传。遇到问题欢迎提 Issue。
          NOTES

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luo-fanqie-${{ steps.meta.outputs.tag }}
          path: |
            dist/*
            release-notes.md

      - name: Publish beta release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="落·番茄 ${{ steps.meta.outputs.build_name }} · Beta"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md --prerelease
          else
            gh release create "$TAG" dist/* \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
