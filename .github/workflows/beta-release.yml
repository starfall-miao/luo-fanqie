name: Beta Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Beta 标签，必须包含 -beta.，例如 v1.2.0-beta.2'
        required: true
        default: 'v1.2.0-beta.2'
      build_number:
        description: 'Android versionCode（需大于已安装版本）'
        required: true
        default: '103'
  push:
    tags:
      - 'v*-beta.*'

permissions:
  contents: write

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      build_name: ${{ steps.meta.outputs.build_name }}
      build_number: ${{ steps.meta.outputs.build_number }}
    steps:
      - name: Resolve tag and version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            BUILD_NUMBER="${{ inputs.build_number }}"
          else
            TAG="${GITHUB_REF_NAME}"
            BUILD_NUMBER="$((GITHUB_RUN_NUMBER + 100))"
          fi
          if [[ "$TAG" != *"-beta."* ]]; then
            echo "::error::Release tags must contain -beta. (got: $TAG)"
            exit 1
          fi
          BUILD_NAME="${TAG#v}"
          BASE_NAME="${BUILD_NAME%%-*}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build_name=$BASE_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

  android:
    name: Android & Web
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --reporter expanded
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/luo-fanqie-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=luo-fanqie-release.jks\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
            echo "Release signing configured."
          else
            echo "::warning::No signing secrets configured; falling back to debug signing."
          fi
      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name="${{ needs.meta.outputs.build_name }}" \
            --build-number="${{ needs.meta.outputs.build_number }}"
      - name: Build Web
        run: |
          flutter build web --release \
            --build-name="${{ needs.meta.outputs.build_name }}" \
            --build-number="${{ needs.meta.outputs.build_number }}"
      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/luo-fanqie-${TAG}-android-universal.apk"
          (cd build/web && zip -qr "../../dist/luo-fanqie-${TAG}-web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: android-web
          path: dist/*
          if-no-files-found: error

  apple:
    name: iOS & macOS
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Ensure CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
      - name: Build iOS (unsigned)
        run: |
          flutter build ios --release --no-codesign \
            --build-name="${{ needs.meta.outputs.build_name }}" \
            --build-number="${{ needs.meta.outputs.build_number }}"
      - name: Package iOS
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "dist/luo-fanqie-${TAG}-ios-unsigned.ipa" Payload
      - name: Build macOS
        run: |
          flutter build macos --release \
            --build-name="${{ needs.meta.outputs.build_name }}" \
            --build-number="${{ needs.meta.outputs.build_number }}"
      - name: Package macOS
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/luo-fanqie-${TAG}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows
        run: |
          flutter build windows --release --build-name="${{ needs.meta.outputs.build_name }}" --build-number="${{ needs.meta.outputs.build_number }}"
      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $tag = "${{ needs.meta.outputs.tag }}"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/luo-fanqie-$tag-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Install Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Install dependencies
        run: flutter pub get
      - name: Build Linux
        run: |
          flutter build linux --release --build-name="${{ needs.meta.outputs.build_name }}" --build-number="${{ needs.meta.outputs.build_number }}"
      - name: Package Linux
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          mkdir -p dist
          tar -czf "dist/luo-fanqie-${TAG}-linux-x64.tar.gz" -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish beta release
    needs: [meta, android, apple, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cd dist
          for file in *; do
            case "$file" in
              *.sha256) ;;
              *) sha256sum "$file" > "$file.sha256" ;;
            esac
          done
          ls -lh
      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          ## 落·番茄 Beta

          由 GitHub Actions 从同一提交构建的多端 Beta 包。所有 Release 均为预发布版本，功能仍在迭代。

          ### 包含的客户端

          | 平台 | 文件 | 说明 |
          | --- | --- | --- |
          | Android | `*-android-universal.apk` | 通用 APK，Android 7.0+，release keystore 签名 |
          | iOS | `*-ios-unsigned.ipa` | 未签名产物，需要使用自己的证书或 AltStore / Sideloadly 重签 |
          | macOS | `*-macos.zip` | 未签名 `.app`，首次运行可能需要移除 quarantine |
          | Windows | `*-windows.zip` | 解压后运行 `luo_fanqie_app.exe` |
          | Linux | `*-linux-x64.tar.gz` | 需要 GTK 3 运行环境，解压后运行 `luo_fanqie_app` |
          | Web | `*-web.zip` | 静态站点，解压后用任意静态服务器托管 |

          ### 验证

          - CI 会先执行 `flutter analyze` 与全部单元/组件测试
          - 每个文件都附带 `.sha256` 校验文件
          - Android APK 使用仓库 Secrets 中的 release keystore 签名

          > iOS、macOS、Windows、Linux 产物没有开发者签名，适合 Beta 测试；正式分发前请自行完成对应平台签名。
          NOTES
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          TITLE="落·番茄 ${{ needs.meta.outputs.build_name }} · Beta"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md --prerelease
          else
            gh release create "$TAG" dist/* \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
