<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="落·番茄 — 把时间种成番茄的专注与待办应用。">
  <meta name="theme-color" content="#2A1722">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="落·番茄">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>落·番茄</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #2A1722;
    }
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background:
        radial-gradient(circle at 50% 62%, rgba(255, 128, 86, 0.26), transparent 46%),
        linear-gradient(160deg, #34202D 0%, #2A1722 46%, #171014 100%);
      color: #FFF4EA;
      font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      transition: opacity 420ms ease;
    }
    #boot-splash img {
      width: 86px;
      height: 86px;
      border-radius: 26px;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.32);
      animation: breathe 2.4s ease-in-out infinite;
    }
    #boot-splash .brand {
      font-size: 21px;
      letter-spacing: 5px;
      font-weight: 600;
    }
    #boot-splash .hint {
      font-size: 12px;
      letter-spacing: 1.5px;
      color: rgba(255, 226, 208, 0.58);
      animation: fade 2.4s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.025); }
    }
    @keyframes fade {
      0%, 100% { opacity: 0.52; }
      50% { opacity: 0.95; }
    }
    .boot-hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="boot-splash">
    <img src="icons/Icon-192.png" alt="落·番茄">
    <div class="brand">落·番茄</div>
    <div class="hint">正在落下今天的第一颗番茄…</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('boot-splash');
      if (!splash) return;
      splash.classList.add('boot-hidden');
      setTimeout(function () { splash.remove(); }, 460);
    });
    setTimeout(function () {
      var splash = document.getElementById('boot-splash');
      if (splash) splash.remove();
    }, 12000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
